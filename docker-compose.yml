services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: puerto
      POSTGRES_PASSWORD: puerto
      POSTGRES_DB: puerto_rico
    ports:
      - "5432:5432"
    volumes:
      - puerto_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puerto -d puerto_rico"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  puerto_pg:
